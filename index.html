<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#007AFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <!-- PWA Meta Tags -->
    <meta name="description" content="A comprehensive fitness tracking application" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FitnessApp" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Fitness Tracking App" />

    <!-- Icons -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <link rel="icon" type="image/svg+xml" sizes="192x192" href="/pwa-192x192.svg" />
    <link rel="icon" type="image/svg+xml" sizes="512x512" href="/pwa-512x512.svg" />
    <link rel="mask-icon" href="/masked-icon.svg" color="#007AFF" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>Fitness Tracking App</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (registration) => {
              console.log('SW registered: ', registration);
            },
            (registrationError) => {
              console.log('SW registration failed: ', registrationError);
            }
          );
        });
      }
    </script>
  </body>
</html>
